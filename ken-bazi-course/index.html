<script type="application/json" id="course-data">{"version":"1.0","element":{"甲":"wood","乙":"wood","丙":"fire","丁":"fire","戊":"earth","己":"earth","庚":"metal","辛":"metal","壬":"water","癸":"water","子":"water","丑":"earth","寅":"wood","卯":"wood","辰":"earth","巳":"fire","午":"fire","未":"earth","申":"metal","酉":"metal","戌":"earth","亥":"water"},"pillars":[{"key":"year","slot":"年柱","gan":"乙","zhi":"丑","ten":"劫財","role":"家族與早年背景的傳統觀察位置","hidden":[["己","正財"],["癸","正印"],["辛","正官"]],"desc":"乙木劫財透干；丑為濕土，藏己、癸、辛。分析時要區分表面透干與地支深層藏氣。"},{"key":"month","slot":"月柱","gan":"戊","zhi":"子","ten":"偏財","role":"月令是判氣勢、取格局的重要起點","hidden":[["癸","正印"]],"desc":"子月水旺，子中癸水為正印；月干戊土是偏財。月令正印與月干偏財並見，需要考慮財印關係。"},{"key":"day","slot":"日柱","gan":"甲","zhi":"申","ten":"日主","role":"日干代表自己；日支也稱夫妻宮","hidden":[["庚","七殺"],["壬","偏印"],["戊","偏財"]],"desc":"甲木是整張命盤的坐標；申中含庚金七殺、壬水偏印、戊土偏財。不能把日支申簡化成只有金。"},{"key":"hour","slot":"時柱","gan":"丁","zhi":"卯","ten":"傷官","role":"後期發展、子女與產出等傳統象義","hidden":[["乙","劫財"]],"desc":"丁火傷官透干，卯木藏乙劫財。卯是甲木的帝旺之地，構成身旺判斷的重要根氣。"}],"chart":{"label":"乙丑・戊子・甲申・丁卯","note":"公開版只保存四柱（節氣法），不含出生日期、時刻與地點。大運、真太陽時等需出生資料的計算，將於 v2.0 改為在本機輸入、只存手機。","keyPoints":[{"tag":"關鍵一｜日主","title":"甲木身旺的初步判讀","body":"甲木生子月，雖非木當令，受旺水印星相生；卯木提供強根，乙木相助。財、傷官、七殺也同時存在，故暫判身旺，而非從旺。","lesson":5},{"tag":"關鍵二｜格局","title":"月令癸正印","body":"子藏癸正印，可依月令格局法先研究正印格；月干戊偏財、時干丁傷官使格局分析不能單看一個名字。","lesson":7},{"tag":"關鍵三｜調候","title":"冬木與丁火","body":"子月寒冷，原局丁火透出但缺明顯火根。學習時要問「丁火是否得力」，而不是一見丁便認為寒暖已平衡。","lesson":8},{"tag":"關鍵四｜作用","title":"子丑合・申子半合・子卯刑","body":"幾組關係同時存在，不能單獨用其中一個合或刑來替全局定吉凶。","lesson":6}],"timeline":[{"label":"本命日柱","gz":"甲申","sub":"甲木日主"},{"label":"現行大運*","gz":"甲申","sub":"與日柱伏吟"},{"label":"2026 流年","gz":"丙午","sub":"食神透・子午沖"}],"timelineNote":"火在冬月具有調候意義，但午火亦沖原局子水。需要同時分析「氣勢改善」與「動態衝突」，不能只挑喜歡的一面。*大運區間約 2017–2027，採既有排盤資訊，細部交運日須另核對。"},"elements":[{"char":"木","en":"Wood","color":"#43846b","keywords":"生發・條達・向上","pos":"向外延伸","your":"甲、乙、卯是原局的木氣，卯為甲木強根。","tip":"木旺不等於只要補金；須看水火土金的整體功能。"},{"char":"火","en":"Fire","color":"#cf7453","keywords":"溫暖・發散・表達","pos":"向上釋放","your":"丁火傷官透出，但子月寒冬，原局缺明顯火根。","tip":"原局有火不代表調候已足夠，還要檢查季節與根氣。"},{"char":"土","en":"Earth","color":"#bb964b","keywords":"承載・轉化・資源","pos":"中介整合","your":"月干戊偏財透出；丑土與申中戊土也提供土氣。","tip":"偏財透干不能直接斷富，需要看日主能否任財。"},{"char":"金","en":"Metal","color":"#8395a4","keywords":"收斂・規範・裁制","pos":"定形與收束","your":"申中庚七殺、丑中辛正官，皆未直接透干。","tip":"藏干未透，其作用必須結合位置、合沖和歲運。"},{"char":"水","en":"Water","color":"#548fba","keywords":"滋養・流動・寒濕","pos":"向下潤澤","your":"子月當令、子中癸正印，申藏壬偏印、丑藏癸。","tip":"水能生木，但過寒也可能使調候成為核心課題。"}],"tenGods":[{"gan":"甲","name":"比肩","rule":"同我同陰陽","image":"自主、同儕、自我主張"},{"gan":"乙","name":"劫財","rule":"同我異陰陽","image":"競爭、合作、資源分配"},{"gan":"丙","name":"食神","rule":"我生同陰陽","image":"產出、表現、創造"},{"gan":"丁","name":"傷官","rule":"我生異陰陽","image":"技術、表達、突破"},{"gan":"戊","name":"偏財","rule":"我剋同陰陽","image":"商機、經營、機動資源"},{"gan":"己","name":"正財","rule":"我剋異陰陽","image":"穩定經營、資產、財務"},{"gan":"庚","name":"七殺","rule":"剋我同陰陽","image":"競爭、壓力、紀律"},{"gan":"辛","name":"正官","rule":"剋我異陰陽","image":"規範、職位、責任"},{"gan":"壬","name":"偏印","rule":"生我同陰陽","image":"特殊知識、研究、變通"},{"gan":"癸","name":"正印","rule":"生我異陰陽","image":"學習、保護、支援"}],"lessons":[{"id":1,"title":"八字是什麼：四柱與日主","phase":"入門｜讀懂命盤","minutes":"20–30 分鐘","intro":"先學會把出生資料轉成四柱，再從日干建立推理坐標。不要急著斷吉凶。","goal":"能指出你的年、月、日、時四柱，並說明日主與月令為什麼重要。","concepts":[{"title":"四柱不是四個年齡標籤","body":"四柱由年、月、日、時各一干一支組成。古籍常用年柱觀祖上背景、月柱觀時令與格局、日柱觀自身及夫妻宮、時柱觀後期發展；這些只是取象角度，不能機械對應人生事件。"},{"title":"日主是一切十神的坐標","body":"你的日柱是「甲申」，甲就是日主。比肩、傷官、正財、七殺等名稱，都以甲木和其他天干的五行陰陽關係推得，與五行數量無直接關係。"},{"title":"月令比單看五行數量更重要","body":"你生在子月。子是冬季水旺之時，先定季節氣勢，再審地支根氣與天干透藏，才有資格討論強弱與用神。"}],"case":"你的四柱依「年→月→日→時」為乙丑、戊子、甲申、丁卯；本教材固定以這個已知命盤學習，不再用公曆月份直接判月柱。","method":["先找日柱日干：甲。","再看月支：子，確定季節。","最後逐柱核對天干、地支與藏干。"],"pitfall":"看見「甲木」就貼上人格標籤；實際論命必須考慮整張命盤與環境條件。","exercise":"請用自己的話解釋：為什麼你的日主是甲，而不是乙或戊？","focus":["year","month","day","hour"],"relations":[],"quiz":[{"q":"日主由哪一個位置決定？","options":["年干","日干","時支"],"answer":1,"explain":"以日柱天干決定日主；你的日干是甲。"},{"q":"你的月令是哪一個地支？","options":["丑","子","申"],"answer":1,"explain":"月柱戊子之「子」為月令。"},{"q":"下列哪一項比較符合論命順序？","options":["先判事件，再找理由","先定日主與月令，再研究全局","直接數五行個數"],"answer":1,"explain":"先定位再辨氣勢，是避免事後套話的重要起點。"}]},{"id":2,"title":"五行生剋與四季氣勢","phase":"入門｜讀懂命盤","minutes":"30–40 分鐘","intro":"五行的核心不是「缺什麼補什麼」，而是生、剋、泄、耗、助與季節氣勢。","goal":"能口述相生、相剋順序，理解為何子月的火和木不能只看字數。","concepts":[{"title":"五行相生、相剋","body":"相生：木→火→土→金→水→木；相剋：木→土→水→火→金→木。「生」是資源傳遞，「剋」是約束關係；對命主是否有利，取決於全局平衡與格局。"},{"title":"以甲木為基準看五種作用","body":"水生甲木是印；木助甲木是比劫；甲木生火是食傷；甲木剋土是財；金剋甲木是官殺。生、助不必然是喜，剋、泄、耗也不必然是忌。"},{"title":"旺相休囚死是季節語言","body":"子月水旺、木相、金休、土囚、火死。此處「死」只是季節力量較弱，不是完全不存在。甲木雖非當令，仍可受水印相生。"},{"title":"調候不是單純計算強弱","body":"你的原局丁火雖透出，但在寒冬可能需審視暖局能力；這是調候問題，不能拿「有丁火」直接替代寒暖分析。"}],"case":"原局甲、乙、卯屬木；丁屬火；戊與丑屬土；申主金；子主水，但申、丑還含多個藏干。因此「五行幾個」只能做起點，不能當結論。","method":["先記生剋循環。","確定出生月令的旺相休囚死。","查看是否有根、有透干、有合會。"],"pitfall":"認為五行缺某項就必須補那項；格局與調候有時更重視五行品質，而非單純數量。","exercise":"試說明：冬季已有丁火，為什麼仍需要討論火是否得力？","focus":[],"relations":[],"quiz":[{"q":"正確的五行相生順序是哪一個？","options":["木→火→土→金→水","木→土→水→火→金","木→金→火→水→土"],"answer":0,"explain":"相生循環為木火土金水，再回木。"},{"q":"子月當旺的五行為何？","options":["火","水","土"],"answer":1,"explain":"子月是冬季水旺之月。"},{"q":"水對甲木的基本十神類別是？","options":["印星","財星","官星"],"answer":0,"explain":"水生木，對甲木是印星。"}]},{"id":3,"title":"天干、地支、藏干與通根","phase":"入門｜讀懂命盤","minutes":"30–40 分鐘","intro":"命盤表面只有八字，但支中藏干決定了它遠比八個符號複雜。","goal":"能閱讀丑、子、申、卯的藏干，辨別「透干」與「通根」。","concepts":[{"title":"十天干與陰陽","body":"甲乙木、丙丁火、戊己土、庚辛金、壬癸水；每對前者陽、後者陰。十神正偏之別必須同時看陰陽，不只是五行。"},{"title":"地支是複合氣","body":"申藏庚壬戊、子藏癸、丑藏己癸辛、卯藏乙。地支不能只用表層五行代替藏干，例如「申只有金」就是錯誤簡化。"},{"title":"透干與通根","body":"透干指天干顯露某五行／十神；通根指天干在地支有相應根氣。甲木可從卯得根，丁火雖透干卻缺乏巳午等直接火根，兩者實力不同。"},{"title":"根氣要區分強弱","body":"長生、祿、帝旺、墓庫及地支本氣、餘氣會影響力度。甲木在卯為帝旺，在申為絕；但「坐絕」不等於整局必然身弱。"}],"case":"乙木在年干透出，卯藏乙可給木氣支持；戊偏財在月干透出、申中亦藏戊。與此相比，庚七殺藏申未透，不能直接與月干戊同等看待。","method":["展開四個地支藏干。","對照甲木十神表。","標注透干、有根、季節是否得氣。"],"pitfall":"將「藏有」與「透出」視為同樣有力，或以單個地支狀態斷整體身弱。","exercise":"寫出申的三個藏干與對甲木的十神名稱。","focus":["year.zhi","month.zhi","day.zhi","hour.zhi"],"relations":[],"quiz":[{"q":"申支的藏干是？","options":["庚、壬、戊","辛、癸、己","丙、戊、庚"],"answer":0,"explain":"申藏庚七殺、壬偏印、戊偏財。"},{"q":"你的甲木最明顯的地支強根是哪一個？","options":["子","卯","丑"],"answer":1,"explain":"卯為甲木帝旺之地，是重要根氣。"},{"q":"丁火透干代表什麼？","options":["丁出現在天干","丁在申中藏著","丁必然有強火根"],"answer":0,"explain":"透干表示出現在天干，不保證有根或必然有力。"}]},{"id":4,"title":"十神：把五行轉成事件語言","phase":"入門｜讀懂命盤","minutes":"35–45 分鐘","intro":"十神不是吉凶判決，而是日主與其他天干的關係語言。","goal":"能根據甲木列出十神，且知道偏財、傷官與七殺不能直接對號入座。","concepts":[{"title":"五組十神","body":"比劫＝同我；食傷＝我生；財＝我剋；官殺＝剋我；印＝生我。每組再分陰陽，形成十神。"},{"title":"甲木十神配對","body":"甲比肩、乙劫財、丙食神、丁傷官、戊偏財、己正財、庚七殺、辛正官、壬偏印、癸正印。請特別熟記丁、戊、庚、癸。"},{"title":"同樣偏財，位置與根氣不同","body":"你的戊偏財透在月干、申中另藏戊。天干主顯、地支主藏是常見取象，但真正作用仍受旺衰、合沖和運勢影響。"},{"title":"傷官生財是作用鏈，不是自動格局","body":"甲木生丁火、丁火生戊土，構成「食傷生財」的可能鏈條；仍需檢查丁是否得力、財是否被制、印財如何互動。"}],"case":"你的天干為乙劫財、戊偏財、甲日主、丁傷官。若把商業談判與資源整合視作取象，可以提出假說，再拿現實案例檢證，而非宣稱命盤必然決定職涯。","method":["辨別與甲的五行生剋。","再辨陰陽相同或相異。","回到命局判斷能否發揮作用。"],"pitfall":"偏財＝股票必賺、傷官＝必然反叛、七殺＝一定有災；這類靜態標籤都過度簡化。","exercise":"請解釋為什麼戊是你的偏財，而己是正財。","focus":["year.gan","month.gan","hour.gan"],"relations":[],"quiz":[{"q":"甲日主遇丁火，丁屬於？","options":["食神","傷官","正官"],"answer":1,"explain":"甲陽、丁陰；我生異陰陽為傷官。"},{"q":"甲日主遇戊土，戊屬於？","options":["偏財","正財","偏印"],"answer":0,"explain":"甲剋戊，且同陰陽，為偏財。"},{"q":"「傷官生財」的正確理解是？","options":["命中必然富裕","觀察食傷向財傳遞力量的可能性","傷官和財星只要同時存在就成功"],"answer":1,"explain":"仍須看力量、根氣、合沖與全局結構。"}]},{"id":5,"title":"身強身弱：得令、得地、得勢","phase":"分析｜論命核心","minutes":"40–50 分鐘","intro":"這是判斷用神前的核心關卡。你會發現「不得令」不等於「身弱」。","goal":"能獨立說明為何這張甲木命盤可暫判身旺，並排除從格的初步可能。","concepts":[{"title":"得令","body":"甲木生子月，旺的是水而非木，所以不直接得木令；但水為印星，提供生扶，不能只看「不得令」三個字。"},{"title":"得地","body":"甲木在時支卯有強根，雖日坐申為絕地，但整局不能因單一日支就判弱。"},{"title":"得勢／得黨","body":"年干乙木劫財與子月正印、申中壬偏印、丑中癸正印，形成印比助身的支援；另一方面丁、戊、申中庚也提供泄耗剋。"},{"title":"從旺格、專旺與羊刃的區別","body":"此局財、傷官、七殺作用存在，不能因身旺便當作從旺或專旺。卯為甲木羊刃之地，卻不等於自動成「羊刃格」。"}],"case":"綜合月令水印生扶、卯木強根、乙木助身，以及財、傷官、官殺的制衡，暫將你判為甲木身旺；這是「有條件的暫定結論」，不是萬用標籤。","method":["依序檢查得令、得地、得勢。","找出剋泄耗力量，排除極端格局。","再論扶抑是否需要疏泄。"],"pitfall":"把不得令直接等同身弱；或看見卯羊刃就先定羊刃格。","exercise":"用三句話分別說明：你的甲木得令、得地、得勢狀況。","focus":["day.gan","month.zhi","hour.zhi","year.gan"],"relations":[],"quiz":[{"q":"甲木生子月，最準確的說法是？","options":["木直接得令","木不得木令，但受水印生扶","一定從弱"],"answer":1,"explain":"月令水旺並生木，仍需搭配根氣判強弱。"},{"q":"原局哪一項是支持身旺的重要因素？","options":["卯木強根","丁火無明根","申中庚金"],"answer":0,"explain":"卯是甲木帝旺之地。"},{"q":"看見甲木在卯為羊刃，能否直接定羊刃格？","options":["可以","不能，還須依格局取法","看流年再說就好"],"answer":1,"explain":"羊刃存在與是否成羊刃格是兩回事。"}]},{"id":6,"title":"刑沖合害：干支之間的作用","phase":"分析｜論命核心","minutes":"40–50 分鐘","intro":"干支關係會改變原局動力，但「見沖即凶、見合即吉」是常見初學錯誤。","goal":"能找出原局子丑合、申子半合、子卯刑，以及 2026 子午沖。","concepts":[{"title":"合而不一定化","body":"原局子丑合，是否化土，不能只憑兩支相鄰就決定，還要看季節、力量與全局。"},{"title":"半合與爭合","body":"申子半合水，與子丑合共同存在；月令子是兩組關係焦點，不可在圖上只畫其中一條。"},{"title":"刑、沖、害、破","body":"子卯刑存在於原局；2026 午會沖子、破卯、害丑。是否對應實際人事變化，需再結合用神與宮位，不能直接宣判災禍。"},{"title":"空亡輔助檢查","body":"甲申日屬甲申旬，旬空午未。原局不見午未，2026 午到來可以列入輔助觀察，但空亡不是事件定論。"}],"case":"你原局的子月同時面對子丑合、申子半合與子卯刑；2026 再有午火沖子。分析時應先看整體氣勢是否改變，再論具體象義。","method":["先標出地支各組關係。","分清原局固有 vs 歲運新增。","檢驗是否有化局條件，再觀察喜忌。"],"pitfall":"看見「子午沖」便直接說離婚、失業或生病，這是跳過完整推理的斷語。","exercise":"說明子丑合、申子半合為何不能各自獨立分析。","focus":["year.zhi","month.zhi","day.zhi","hour.zhi"],"relations":["子丑合","申子半合","子卯刑"],"quiz":[{"q":"你原局有哪一組六合？","options":["子丑合","申午合","卯申合"],"answer":0,"explain":"年支丑與月支子為子丑合。"},{"q":"原局另一組半合是？","options":["申子半合","丑卯半合","申卯半合"],"answer":0,"explain":"申與子為申子半合水。"},{"q":"2026 午火與原局子水的主要關係是？","options":["六合","六沖","三會"],"answer":1,"explain":"子與午相沖，但沖不等於必然凶事。"}]},{"id":7,"title":"格局：月令正印與傷官生財","phase":"分析｜論命核心","minutes":"45–60 分鐘","intro":"格局派的「用神」不等同所有現代命理的「喜用五行」，先分清兩種語言。","goal":"能從子中癸正印起步分析格局，並將丁生戊作為候選作用鏈。","concepts":[{"title":"以月令本氣取格","body":"你的月支子中癸是甲木正印，因此依《子平真詮》月令取格法，優先研究正印格的成立、成敗與救應。"},{"title":"偏財透月干","body":"月干戊為偏財，與正印之間形成財印關係；必須看彼此力量與是否有護衛、轉化條件。"},{"title":"傷官生財的檢驗","body":"丁傷官透時干、戊偏財透月干，五行火生土構成流通關係；但丁無強根、子月寒冷，不能僅有兩干便斷成格。"},{"title":"殺印相生是另一層次","body":"申藏庚七殺與壬偏印，金生水、水生木有可能構成關聯；庚壬未透，不能把隱含流通說成已明顯成格。"}],"case":"你的學習重點不是找「最炫的格名」，而是先研究正印格基礎，再分析戊偏財、丁傷官、申中庚壬的成敗與取用。","method":["先從月令子藏癸取正印。","審視天干戊、丁及各自根氣。","最後研究是否有成格、破格、救應。"],"pitfall":"因為戊偏財在月干，就跳過子中癸而直接判偏財格。","exercise":"請寫下「月令格局用神」與「扶抑喜用神」的差別。","focus":["month.zhi","month.gan","hour.gan","day.zhi"],"relations":["丁火生戊土","子中癸＝正印"],"quiz":[{"q":"以月令本氣取格，你應優先研究什麼？","options":["正印格","偏財格","七殺格"],"answer":0,"explain":"子月本氣癸為甲木正印。"},{"q":"為什麼不能直接斷定「傷官生財格」？","options":["因丁戊不能相生","尚須檢查根氣、季節與全局","因甲木不可能生丁火"],"answer":1,"explain":"丁生戊成立於五行關係，能否發揮格局作用另當別論。"},{"q":"申藏庚七殺代表什麼？","options":["七殺已透干","七殺存在於支中但未透","全局一定殺格"],"answer":1,"explain":"申中庚屬藏干，不能等同天干透出。"}]},{"id":8,"title":"用神四法：扶抑、調候、通關、病藥","phase":"分析｜論命核心","minutes":"50–65 分鐘","intro":"這堂專門拆解「身旺喜什麼」與「冬木需什麼」為什麼可能是兩種答案。","goal":"能清楚分開格局用神與四種取用視角，且不要用單一顏色判吉凶。","concepts":[{"title":"扶抑","body":"暫判甲木身旺，扶抑要研究如何適度泄、耗、剋，避免過度印比。金、火、土能否發揮作用還要看通關與氣勢。"},{"title":"調候","body":"子月寒木，須研究寒暖燥濕。你有丁火透出卻少火根，故調候需看丁火是否有效、行運何時添暖，不能只看字面上「已有火」。"},{"title":"通關","body":"例如金剋木與水印生木之間，可能由金生水、水生木形成轉化；但是否真的通關，取決於位置、力量和所需條件。"},{"title":"病藥","body":"先辨命局結構上的核心「病」如寒濕、財印牽制、某種失衡，再找能解決的「藥」。病藥是傳統比喻，與醫療診斷無關。"},{"title":"經典交叉檢查","body":"《滴天髓》看全局氣勢，《子平真詮》重月令格局，《窮通寶鑑》重時令調候。讀書要區分各書系統，避免把不同語境的「用神」混成一張喜忌表。"}],"case":"對你的甲木，扶抑研究印比旺後如何疏導；調候研究冬月火的有效性；格局研究正印及財印；病藥研究寒濕與牽制。這些可相互參照，不應草率宣稱「所有火運必吉」。","method":["區分每個用神概念在解決什麼問題。","各自列出成立與失效條件。","放回大運流年檢驗，不為了結論改變取用標準。"],"pitfall":"把某個五行一律貼「喜」或「忌」，不看它出現於何處、有無根氣、是否造成新沖合。","exercise":"以丁火為例，寫出「有丁火」與「丁火有力」差在哪裡。","focus":["day.gan","hour.gan","month.zhi"],"relations":[],"quiz":[{"q":"用神四法中，主要研究季節寒暖的是？","options":["調候","扶抑","空亡"],"answer":0,"explain":"調候以季節寒暖燥濕為核心。"},{"q":"身旺就代表所有水運都不好嗎？","options":["是","否，須看全局功能與運勢互動","只看日干就行"],"answer":1,"explain":"喜忌不是永久不變的單色標籤。"},{"q":"病藥用神的「病」是什麼？","options":["醫生診斷的疾病","命局結構上的失衡／問題","一定會生病的年份"],"answer":1,"explain":"病藥是古典命理中的結構比喻。"}]},{"id":9,"title":"大運流年：2026 丙午實戰","phase":"應用｜流年實戰","minutes":"45–60 分鐘","intro":"把原局、十年大運、一年流年疊加，練習先論作用、後論事件。","goal":"能辨認甲申大運的日柱伏吟、丙午年的食神與子午沖。","concepts":[{"title":"三層推理","body":"原局是結構，大運是十年環境，流年是一年觸發條件。先定原局，再看大運如何改變格局，最後評估流年引動；避免跳過原局。"},{"title":"甲申大運與日柱伏吟","body":"以既有排盤的大運資訊，約2017–2027為甲申運；與本命甲申日柱相同，稱伏吟。伏吟是重複、強調的象義，不直接等於凶事。實際起運交接應以所用排盤規則核對。"},{"title":"2026 丙午的十神","body":"丙對甲木是食神，午含丁、己，可涉及傷官與正財。當年火氣增強，有調候面向，也會形成新的干支作用。"},{"title":"子午沖與其他關係","body":"流年午沖本命月支子，亦可分析卯午破、丑午害與午未空亡的輔助問題，但權重須服從全局；不能把衝突加總當成「凶分」。"},{"title":"觀察而不是保證","body":"可把組織變動、職涯職能改造、財務分配或家庭協調列為情境假說，配合職位資訊與實際生活評估；不能憑八字承諾升遷、投資績效或醫療結果。"}],"case":"你目前工作如遇新職務評估，可用「表達產出（丙食神）＋環境變化（子午沖）」作為反思框架；是否轉職仍取決於職位權責、薪酬、管理幅度與公司情勢。","method":["標注原局關係與日主強弱。","檢查甲申大運與原局的重複／刑沖。","再加入丙午並列出促成條件與反例。"],"pitfall":"將子午沖當成失業、離婚或發財的單一指標；先問「真的發生什麼」，再去找自己喜歡的符號。","exercise":"寫出 2026 丙午對你的三條「有條件的觀察假說」，每條都須寫「不能因此斷言⋯」。","focus":["day","month.zhi"],"relations":["甲申大運・日柱伏吟","丙午流年・子午沖"],"quiz":[{"q":"2026 天干丙對甲木是哪個十神？","options":["食神","傷官","正財"],"answer":0,"explain":"甲木生丙火、陰陽同，為食神。"},{"q":"甲申大運與本命甲申日柱相同叫什麼？","options":["伏吟","反吟","三合"],"answer":0,"explain":"同一組干支重現稱伏吟。"},{"q":"子午沖的合理分析方式是？","options":["一定發生壞事","先分析全局喜忌，再提出可驗證假說","沖越多越有錢"],"answer":1,"explain":"沖是動態關係，不直接對應固定事件。"}]},{"id":10,"title":"實戰論命：事業、財運、婚姻與健康","phase":"應用｜流年實戰","minutes":"60–75 分鐘","intro":"整合前九堂建立一份你自己的「命理分析報告」，並學會標注信心、風險與反例。","goal":"能依完整論命流程分析同一命盤，區分傳統象義與現實決策依據。","concepts":[{"title":"標準檢核流程","body":"日主與月令→透藏與根氣→身旺身弱→合沖刑害與拱夾→格局→扶抑／通關／病藥／調候→空亡神煞→大運流年→現實驗證。"},{"title":"事業","body":"看官殺所代表的規範壓力、食傷所代表的產出表達、財星的資源經營、印星的學習支持。談職涯時務必加入薪資、匯報線、團隊和可控風險。"},{"title":"財運","body":"研究偏財戊與正財己、丁火是否能生戊、比劫與印的介入。這只能是文化角度的反思，不能據此制定槓桿、賭博或投資下單決策。"},{"title":"婚姻","body":"傳統男命常參看財星與日支夫妻宮，也要觀察合沖與歲運；但命盤無法替配偶表達意見，更不能代替溝通、同意與相處事實。"},{"title":"健康","body":"古典五行寒暖燥濕是象義系統，不能預測診斷、中風、心肺疾病或檢查結果。健康問題以醫師和檢驗資料為準。"},{"title":"用徐樂吾命例檢驗推論","body":"採「先說命局依據，再提出假說，再比對事件」的方式；不模仿古例的宿命斷語，也避免選擇性回顧已知事情。"}],"case":"本命暫判甲木身旺、子月印星旺、卯木強根、丁傷官與戊偏財透、申藏庚壬戊。2026 丙午帶來食神與子午沖：可研究暖局與變動並存，但不對事業、財運、婚姻、健康下必然判斷。","method":["寫出三個最有力原局證據。","列出支持與反對用神假說的條件。","每項現實決策都增加一欄「客觀資訊與行動方案」。"],"pitfall":"用結果倒推原因，或只挑符合命理推測的事件；真正進步需要追蹤失準與替代解釋。","exercise":"請做一頁完整論命：原局氣勢100字、格局100字、用神100字、2026情境與反例各100字。","focus":["year","month","day","hour"],"relations":[],"quiz":[{"q":"完整論命最合適的先後順序是？","options":["先神煞再看日主","原局→格局與用神→大運流年→現實驗證","先下結論再查證"],"answer":1,"explain":"先掌握原局與作用機制，再處理運勢。"},{"q":"用命理分析職涯時，哪項做法最妥當？","options":["命盤好就立刻辭職","將命理當文化框架，配合職位與薪酬客觀評估","只看食神數量"],"answer":1,"explain":"重大決策須以能確認的現實資料與風險為主。"},{"q":"如何降低命理分析的確認偏誤？","options":["只記錄說中的事情","先記推論條件與反例，再對照實際結果","讓同一事件有很多模糊解釋"],"answer":1,"explain":"預先記錄可檢驗條件，才能避免事後對號入座。"}]}],"glossary":[{"term":"日主","def":"日柱天干，十神判定的坐標；本命為甲。","cat":"基礎","lessons":[1,4,9,10]},{"term":"月令","def":"月柱地支，判季節氣勢與月令格局的重要起點；本命為子。","cat":"基礎","lessons":[1,2,5,6,7,8,10]},{"term":"四柱","def":"出生年、月、日、時四組干支。","cat":"基礎","lessons":[1]},{"term":"藏干","def":"地支內所包含的天干，如申藏庚壬戊。","cat":"基礎","lessons":[1,2,3,7]},{"term":"透干","def":"天干顯現某種五行或十神。","cat":"基礎","lessons":[2,3,7]},{"term":"通根","def":"天干在地支找到相應根氣。","cat":"基礎","lessons":[3]},{"term":"印星","def":"生我者；水對甲木是印。","cat":"十神","lessons":[2,5,10]},{"term":"財星","def":"我剋者；土對甲木是財。","cat":"十神","lessons":[2,4,10]},{"term":"食傷","def":"我生者；火對甲木是食傷。","cat":"十神","lessons":[2,4,10]},{"term":"官殺","def":"剋我者；金對甲木是官殺。","cat":"十神","lessons":[2,4,5,10]},{"term":"比劫","def":"與我同五行者；木對甲木是比劫。","cat":"十神","lessons":[2,4,10]},{"term":"帝旺","def":"十二長生中較旺的階段；甲木在卯為帝旺。","cat":"氣勢","lessons":[3,5]},{"term":"扶抑","def":"依旺衰考慮扶助或抑制的取用思路。","cat":"用神","lessons":[5,7,8,10]},{"term":"調候","def":"從季節寒暖燥濕思考命局所需。","cat":"用神","lessons":[2,8,9,10]},{"term":"通關","def":"在相剋或衝突的五行間尋求流通轉化。","cat":"用神","lessons":[7,8,10]},{"term":"病藥","def":"將失衡視作「病」，以適當作用作「藥」的古典比喻。","cat":"用神","lessons":[8,10]},{"term":"伏吟","def":"同一組干支重複出現，例如本命甲申日遇甲申大運。","cat":"流年","lessons":[9]},{"term":"空亡","def":"六甲旬缺兩支；甲申旬空午未。","cat":"流年","lessons":[6,8,9,10]},{"term":"子午沖","def":"地支子與午相沖，2026 丙午引動原局子月。","cat":"作用","lessons":[6,9,10]},{"term":"申子半合","def":"申、子構成半合水的形式，是否有力需再看全局。","cat":"作用","lessons":[6]},{"term":"正印格","def":"以月令正印為基礎候選的月令格局，須審成敗救應。","cat":"格局","lessons":[7]},{"term":"傷官生財","def":"食傷向財星傳力的作用鏈，非單憑兩星就必然成格。","cat":"格局","lessons":[4,7]}],"quote":"不是看見一個字，就斷一件事；而是先看全局氣勢，再看它如何作用。"}</script>
